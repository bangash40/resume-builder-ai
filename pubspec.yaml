name: resume_builder_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.4
  google_generative_ai: ^0.4.7
  connectivity_plus: ^7.3.1
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  # Resume fonts, bundled so PDF export works offline.
  assets:
    - assets/fonts/
